<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="0.6" stop-color="#161616"/>
      <stop offset="1" stop-color="#2A0300"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E30F00"/>
      <stop offset="1" stop-color="#8A0900"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name  { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F2F2F2; letter-spacing: 1px; }
      .role  { font: 600 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #E30F00; letter-spacing: 6px; }
      .stack { font: 400 18px 'Consolas', 'Courier New', monospace; fill: #8C8C8C; }
      .code  { font: 700 120px 'Consolas', 'Courier New', monospace; fill: #E30F00; fill-opacity: 0.12; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- detalhe diagonal vermelho à direita -->
  <polygon points="900,0 1200,0 1200,300 760,300" fill="url(#red)" opacity="0.9"/>
  <polygon points="860,0 900,0 760,300 720,300" fill="#E30F00" opacity="0.35"/>
  <text x="1150" y="200" text-anchor="end" class="code" style="fill:#0D0D0D;fill-opacity:0.35">&lt;/&gt;</text>

  <!-- barra de acento -->
  <rect x="70" y="78" width="6" height="140" fill="#E30F00"/>

  <text x="100" y="140" class="name">Gustavo Hermogenes</text>
  <text x="102" y="180" class="role">DESENVOLVEDOR BACK-END</text>
  <text x="102" y="214" class="stack">$ php · laravel · mysql · java<tspan class="cursor" fill="#E30F00">_</tspan></text>

  <!-- linha inferior -->
  <rect x="0" y="294" width="1200" height="6" fill="#E30F00"/>
</svg>
