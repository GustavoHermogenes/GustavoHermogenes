<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- degradê suave: preto → grafite → vinho → vermelho -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0"    stop-color="#0D0D0D"/>
      <stop offset="0.45" stop-color="#141414"/>
      <stop offset="0.65" stop-color="#2B0400"/>
      <stop offset="0.82" stop-color="#7A0800"/>
      <stop offset="1"    stop-color="#E30F00"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#E30F00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E30F00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#E30F00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E30F00" stop-opacity="0.8"/>
      <stop offset="1"   stop-color="#E30F00"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .name  { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F2F2F2; letter-spacing: 1px; }
      .role  { font: 600 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #E30F00; letter-spacing: 6px; }
      .stack { font: 400 18px 'Consolas', 'Courier New', monospace; fill: #8C8C8C; }
      .code  { font: 700 120px 'Consolas', 'Courier New', monospace; fill: #FFFFFF; fill-opacity: 0.08; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <text x="1150" y="200" text-anchor="end" class="code">&lt;/&gt;</text>

  <!-- barra de acento -->
  <rect x="70" y="78" width="6" height="140" fill="#E30F00"/>

  <text x="100" y="140" class="name">Gustavo Hermogenes</text>
  <text x="102" y="180" class="role">DESENVOLVEDOR FULL STACK</text>
  <text x="102" y="214" class="stack">php · laravel · mysql · java · javascript<tspan class="cursor" fill="#E30F00">_</tspan></text>

  <!-- linha inferior em degradê -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#line)"/>
</svg>
